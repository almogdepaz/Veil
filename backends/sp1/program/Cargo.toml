[package]
name = "clvm-zk-sp1-program"
version = "0.1.0"
edition = "2021"

[dependencies]
sp1-zkvm = "=5.2.4"
sp1-lib = "=5.2.4"
clvm-zk-core = { path = "../../../clvm_zk_core", default-features = false, features = ["sp1"] }
# use sp1's patched sha2 for syscall optimization
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", rev = "1f224388fdede7cef649bce0d63876d1a9e3f515", default-features = false }
# BLS signature verification support with SP1 precompiles (v2 = digest 0.9 compatible)
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381.git", rev = "8a85990f933961e689604d3ac87e15beaedf74d9", default-features = false, features = ["groups", "pairings", "experimental", "alloc"] }
# Use sha2 0.9 to match bls12_381's digest 0.9 dependency
sha2_v09 = { package = "sha2", version = "0.9", default-features = false }

