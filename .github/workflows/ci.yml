name: Required CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.89.0"

jobs:
  mock:
    name: quality / mock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy

      - name: Cache Cargo data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/mock
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-mock-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-mock-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy-mock --locked -- -D warnings

      - name: Run mock tests
        run: cargo test-mock --locked

  sp1:
    name: build / sp1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Cache Cargo data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/sp1
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-sp1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-sp1-

      - name: Check SP1 host integration
        env:
          SP1_SKIP_PROGRAM_BUILD: "true"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            cargo check-sp1 --locked && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Check SP1 guest crates
        run: >-
          cargo check --locked
          -p clvm-zk-sp1-program
          -p clvm-zk-sp1-recursive
          -p clvm-zk-sp1-program-settlement

  risc0:
    name: build / risc0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Cache Cargo data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/risc0
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-risc0-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-risc0-

      - name: Check RISC Zero host integration
        env:
          RISC0_SKIP_BUILD: "1"
        run: cargo check-risc0 --locked

      - name: Check RISC Zero guest crates
        run: >-
          cargo check --locked
          -p clvm-risc0-guest
          -p clvm-zk-risc0-guest-recursive
          -p clvm-zk-risc0-guest-settlement
