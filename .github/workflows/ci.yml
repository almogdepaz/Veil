name: Required CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.89.0"

jobs:
  mock:
    name: quality / mock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/mock
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-mock-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-mock-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy-mock --locked -- -D warnings

      - name: Run mock tests
        run: cargo test-mock --locked

  sp1:
    name: build / sp1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/sp1
            target/elf-compilation
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-sp1-v5.2.4-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-sp1-v5.2.4-

      - name: Install SP1 v5.2.4
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sp1.succinct.xyz -o /tmp/sp1up.sh
          echo "5f2b976287501d3f5feb62a2a96bbdfd1f5232c9badaf7547ed837c0366f3a7b  /tmp/sp1up.sh" | sha256sum -c -
          bash /tmp/sp1up.sh
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
          "$HOME/.sp1/bin/sp1up" --version v5.2.4
          "$HOME/.sp1/bin/cargo-prove" prove --version | grep '2a51f3d'

      - name: Build and check SP1 integration
        shell: bash
        run: |
          for attempt in 1 2 3; do
            cargo check-sp1 --locked && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Check SP1 guest crates
        run: >-
          cargo check --locked
          -p clvm-zk-sp1-program
          -p clvm-zk-sp1-recursive
          -p clvm-zk-sp1-program-settlement

  risc0:
    name: build / risc0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/risc0
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-risc0-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-risc0-

      - name: Check RISC Zero host integration
        env:
          RISC0_SKIP_BUILD: "1"
        run: cargo check-risc0 --locked

      - name: Check RISC Zero guest crates
        run: >-
          cargo check --locked
          -p clvm-risc0-guest
          -p clvm-zk-risc0-guest-recursive
          -p clvm-zk-risc0-guest-settlement
